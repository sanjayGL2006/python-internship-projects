<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-blur: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            width: 90%;
            flex: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1, h2, h3 {
            font-weight: 600;
        }

        h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--text-primary);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: white;
        }

        /* Modal */
        #auth-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #auth-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 400px;
            text-align: center;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin-top: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--surface-border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-revoked { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        /* Output Box */
        .output-box {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            border: 1px solid var(--surface-border);
            min-height: 80px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            color: #a78bfa;
        }

        /* Create form area */
        .create-area {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 24px;
        }
        .create-area .input-group {
            margin-bottom: 0;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <div class="glass-panel modal-content">
            <h2 style="margin-bottom: 16px;">Admin Authentication</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;">Please enter your Admin Token to manage API keys.</p>
            <div class="input-group">
                <input type="password" id="admin-token-input" placeholder="Enter Admin Token...">
            </div>
            <button class="btn-primary" onclick="saveAdminToken()" style="width: 100%;">Unlock Dashboard</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="main-app" style="display: none;">
        <header>
            <h1>SPVM API Manager</h1>
            <button class="btn-danger" style="border:none;" onclick="logout()">Logout</button>
        </header>

        <div class="glass-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('keys')">Key Management</button>
                <button class="tab-btn" onclick="switchTab('playground')">API Playground</button>
            </div>

            <!-- Keys Tab -->
            <div id="tab-keys" class="tab-content active">
                <div class="create-area">
                    <div class="input-group">
                        <label for="new-key-name">Client Name</label>
                        <input type="text" id="new-key-name" placeholder="e.g., frontend-app, analytics-script">
                    </div>
                    <button class="btn-primary" onclick="createKey()">Generate New Key</button>
                </div>
                
                <div id="new-key-result" style="display: none; margin-bottom: 24px; padding: 16px; background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px;">
                    <p style="color: #60a5fa; margin-bottom: 8px; font-weight: 500;">Key Generated Successfully! Save it now:</p>
                    <code id="new-key-display" style="font-size: 18px; user-select: all; display: block; padding: 12px; background: rgba(0,0,0,0.5); border-radius: 4px;"></code>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Prefix</th>
                                <th>Created</th>
                                <th>Last Used</th>
                                <th>Requests</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="keys-table-body">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Playground Tab -->
            <div id="tab-playground" class="tab-content">
                <div class="input-group">
                    <label for="play-api-key">API Key</label>
                    <input type="password" id="play-api-key" placeholder="spvm_...">
                </div>
                <div class="input-group">
                    <label for="play-prompt">Prompt</label>
                    <textarea id="play-prompt" placeholder="Enter your prompt for the model..."></textarea>
                </div>
                <button class="btn-primary" onclick="testModel()">Run Model</button>

                <h3 style="margin-top: 24px; font-size: 16px; color: var(--text-secondary);">Response</h3>
                <div class="output-box" id="play-output">Awaiting input...</div>
            </div>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem('spvmAdminToken');
        const API_BASE = ''; // relative to current origin

        // Initialize App
        if (!adminToken) {
            document.getElementById('auth-modal').classList.add('active');
        } else {
            initDashboard();
        }

        function saveAdminToken() {
            let token = document.getElementById('admin-token-input').value.trim();
            // Automatically remove any surrounding quotes if accidentally copy-pasted
            token = token.replace(/^["']|["']$/g, '').trim();
            
            if (token) {
                adminToken = token;
                localStorage.setItem('spvmAdminToken', token);
                document.getElementById('auth-modal').classList.remove('active');
                initDashboard();
            }
        }

        function logout() {
            localStorage.removeItem('spvmAdminToken');
            location.reload();
        }

        function initDashboard() {
            document.getElementById('main-app').style.display = 'flex';
            loadKeys();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.target.classList.add('active');
        }

        async function fetchWithAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'X-Admin-Token': adminToken,
                'Content-Type': 'application/json'
            };
            const response = await fetch(url, options);
            if (response.status === 401) {
                alert("Unauthorized: Invalid Admin Token.");
                logout();
                throw new Error("Unauthorized");
            }
            return response;
        }

        async function loadKeys() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/admin/keys`);
                const data = await res.json();
                renderTable(data.keys);
            } catch (e) {
                console.error(e);
            }
        }

        function renderTable(keys) {
            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = '';
            
            keys.forEach(key => {
                const tr = document.createElement('tr');
                const isRevoked = key.revoked === 1;
                
                tr.innerHTML = `
                    <td>${key.id}</td>
                    <td><strong>${key.name}</strong></td>
                    <td style="font-family: monospace; color: var(--text-secondary);">${key.key_prefix}...</td>
                    <td>${new Date(key.created_at + 'Z').toLocaleString()}</td>
                    <td>${key.last_used_at ? new Date(key.last_used_at + 'Z').toLocaleString() : 'Never'}</td>
                    <td>${key.request_count}</td>
                    <td>
                        <span class="status-badge ${isRevoked ? 'status-revoked' : 'status-active'}">
                            ${isRevoked ? 'REVOKED' : 'ACTIVE'}
                        </span>
                    </td>
                    <td>
                        ${!isRevoked ? `<button class="btn-danger" onclick="revokeKey(${key.id})">Revoke</button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function createKey() {
            const nameInput = document.getElementById('new-key-name');
            const name = nameInput.value.trim();
            if (!name) return alert("Please enter a client name");

            try {
                const res = await fetchWithAuth(`${API_BASE}/admin/keys`, {
                    method: 'POST',
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                
                if (res.ok) {
                    nameInput.value = '';
                    const resultDiv = document.getElementById('new-key-result');
                    const keyDisplay = document.getElementById('new-key-display');
                    
                    keyDisplay.textContent = data.api_key;
                    resultDiv.style.display = 'block';
                    
                    // Auto-fill playground
                    document.getElementById('play-api-key').value = data.api_key;
                    
                    loadKeys();
                } else {
                    alert(data.error || "Failed to create key");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function revokeKey(id) {
            if (!confirm(`Are you sure you want to revoke key ID ${id}? This cannot be undone.`)) return;
            
            try {
                const res = await fetchWithAuth(`${API_BASE}/admin/keys/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    loadKeys();
                } else {
                    const data = await res.json();
                    alert(data.error || "Failed to revoke key");
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Playground
        async function testModel() {
            const apiKey = document.getElementById('play-api-key').value.trim();
            const prompt = document.getElementById('play-prompt').value.trim();
            const outputBox = document.getElementById('play-output');
            
            if (!apiKey || !prompt) return alert("Please provide both an API Key and a prompt.");
            
            outputBox.textContent = "Loading...";
            
            try {
                const res = await fetch(`${API_BASE}/v1/generate`, {
                    method: 'POST',
                    headers: {
                        'X-API-Key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });
                
                const data = await res.json();
                if (res.ok) {
                    outputBox.textContent = JSON.stringify(data, null, 2);
                } else {
                    outputBox.textContent = `Error ${res.status}: ${data.error || JSON.stringify(data)}`;
                }
            } catch (e) {
                outputBox.textContent = "Request failed. See console.";
                console.error(e);
            }
        }
    </script>
</body>
</html>
